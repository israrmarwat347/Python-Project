---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install baseline packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - vim
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - jq
    state: present
